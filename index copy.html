<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROJECA - Redes Sociais Full Width</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
        }

        .social-section {
            background-color: #ebebeb; /* Cor de fundo cinza claro */
            min-height: 180px;
            width: 100%;
        }

        .social-title {
            color: #3e7d28;
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        .social-text {
            color: #444444;
            font-size: 0.95rem;
        }

        /* Quadrados dos Botões - Ajustados para preencher melhor em telas grandes */
        .social-box {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 140px;
            height: 140px;
            transition: transform 0.2s ease;
            text-decoration: none;
        }

        .social-box:hover {
            transform: scale(1.02);
        }

        .social-box i {
            color: #ffffff;
            font-size: 3.5rem;
        }

        /* Cores de fundo */
        .bg-facebook { background-color: #415e9b; }
        .bg-instagram { background-color: #1a5b8c; }
        .bg-youtube { background-color: #bd0000; }
        .bg-linkedin { background-color: #0c82be; }

        .bg-youtube i { font-size: 4rem; }
    </style>
</head>
<body>

    <section class="social-section p-0 m-0 container-fluid">
        <div class="row g-0 align-items-center w-100 m-0">
            
            <div class="col-lg-4 text-center text-lg-end py-4 pe-lg-5 ps-3">
                <h2 class="social-title text-uppercase m-0">Vamos manter contato</h2>
                <p class="social-text m-0 mt-2">
                    Siga-nos nas redes sociais e fique por dentro de todas as nossas ações.
                </p>
            </div>

            <div class="col-lg-8 p-0">
                <div class="d-flex flex-wrap justify-content-center justify-content-lg-start gap-0">
                    
                    <a href="#" class="social-box bg-facebook flex-grow-1 flex-lg-grow-0" aria-label="Facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>

                    <a href="#" class="social-box bg-instagram flex-grow-1 flex-lg-grow-0" aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>

                    <a href="#" class="social-box bg-youtube flex-grow-1 flex-lg-grow-0" aria-label="YouTube">
                        <i class="fa-brands fa-youtube"></i>
                    </a>

                    <a href="#" class="social-box bg-linkedin flex-grow-1 flex-lg-grow-0" aria-label="LinkedIn">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>

                </div>
            </div>

        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
