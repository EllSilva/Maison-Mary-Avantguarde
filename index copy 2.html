<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand & Stone - Hero com Bootstrap & Vue 2</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>

  <style>
    /* Customizações finas além do Bootstrap */
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #1a1a1a;
      overflow-x: hidden;
    }

    .hero-section {
      position: relative;
      min-height: 100vh;
      background-color: #2b2521;
      background-image: url('https://images.unsplash.com/photo-1600334129128-685c5582fd35?q=80&w=2070'); 
      background-size: cover;
      background-position: center right;
      background-repeat: no-repeat;
      animation: imageScale 2.5s ease-out forwards;
    }

    /* Película escura de contraste */
    .hero-image-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to right, rgba(0, 0, 0, 0.75) 35%, rgba(0, 0, 0, 0.2) 100%);
      z-index: 1;
    }

    /* Ajuste de Z-Index para ficar acima do overlay do Bootstrap */
    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 540px;
    }

    /* Estilização da Tipografia */
    .subtitle {
      font-size: 0.75rem;
      letter-spacing: 2px;
    }

    .title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 3.8rem;
      line-height: 1.15;
    }

    /* Animações de Entrada (Cascata) */
    .animate-item {
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 1s cubic-bezier(0.215, 0.610, 0.355, 1) forwards;
    }
    .anim-1 { animation-delay: 0.2s; }
    .anim-2 { animation-delay: 0.4s; }
    .anim-3 { animation-delay: 0.6s; }
    .anim-4 { animation-delay: 0.8s; }

    /* Efeitos Customizados nos Botões do Bootstrap */
    .btn-custom {
      padding: 0.85rem 2rem;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 4px;
      transition: all 0.3s ease;
    }
    .btn-custom:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
    }
    .btn-custom:active {
      transform: scale(0.98) translateY(0) !important;
    }

    /* Keyframes */
    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes imageScale {
      from { background-size: 105%; }
      to { background-size: 100%; }
    }

    /* Responsividade extra para telas pequenas */
    @media (max-width: 768px) {
      .hero-section {
        background-position: 70% center;
        animation: none;
      }
      .title {
        font-size: 2.8rem;
      }
    }
  </style>
</head>
<body>

  <div id="app">
    <section class="hero-section d-flex align-items-center px-3 px-md-5">
      
      <div class="container-fluid">
        <div class="row">
          <div class="col-12 col-md-8 col-lg-6">
            
            <div class="hero-content text-white">
              
              <span class="subtitle text-uppercase fw-bold mb-4 d-block animate-item anim-1">
                {{ subtitle }}
              </span>
              
              <h1 class="title fw-normal mb-4 animate-item anim-2" v-html="formattedTitle"></h1>
              
              <p class="description fw-light mb-5 lh-base opacity-75 animate-item anim-3">
                {{ description }}
              </p>
              
              <div class="d-grid gap-3 col-11 col-sm-7 col-md-6 col-lg-5 mx-0 animate-item anim-4">
                <button class="btn btn-light btn-custom text-dark" @click="learnMoreAction">
                  Learn More
                </button>
                <button class="btn btn-outline-light btn-custom" @click="joinTeamAction">
                  Join Our Team
                </button>
              </div>

            </div>

          </div>
        </div>
      </div>

      <div class="hero-image-overlay"></div>

    </section>
  </div>

  <script>
    new Vue({
      el: '#app',
      data: {
        subtitle: 'MEET OUR EXPERTS',
        title: 'Licensed. Trusted. Exceptional.',
        description: 'Our skilled massage therapists and licensed estheticians use their expertise to personalize treatments, leaving you relaxed, refreshed, & deeply cared for.'
      },
      computed: {
        formattedTitle: function() {
          return this.title.split('. ').join('.<br>');
        }
      },
      methods: {
        learnMoreAction: function() {
          console.log('Learn More via Bootstrap + Vue 2');
        },
        joinTeamAction: function() {
          console.log('Join Our Team via Bootstrap + Vue 2');
        }
      }
    });
  </script>
</body>
</html>
