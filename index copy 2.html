<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Botão Fechar</title>

<style>
.close-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 45px;
    height: 45px;
    border: none;
    border-radius: 50%;
    background: #ff4d4f;
    color: #fff;
    font-size: 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: all .3s ease;
    z-index: 9999;
}

.close-btn:hover {
    background: #d9363e;
    transform: scale(1.1);
}
</style>
</head>
<body>

<button class="close-btn" onclick="fechar()">✕</button>

<script>
function fechar() {
    alert('Fechar janela');
}
</script>

</body>
</html>
