<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Vertical (Cima para Baixo) com Vue.js 2</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    
    <style>
        /* --- Estilos Gerais (Mantidos) --- */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
            overflow: hidden; /* Evita barras de rolagem durante a animação */
        }

        .btn-abrir {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #42b983;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-abrir:hover {
            background-color: #35495e;
        }

        /* --- Estilos do Modal (Fundo Fixo) --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5); /* O fundo escurece */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            /* Transição do fundo (mantida como fade suave) */
            transition: opacity 0.5s ease;
        }

        /* --- Estilos do Conteúdo do Modal (O que move) --- */
        .modal-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 400px;
            max-width: 90%;
            text-align: center;
            /* Definimos a transição padrão do movimento aqui */
            transition: transform 0.5s ease-out, opacity 0.5s ease-out;
        }

        .btn-fechar {
            margin-top: 20px;
            padding: 8px 15px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        /* --- NOVAS Classes de Animação Vertical do Vue (Slide Vertical) --- */
        
        /* 1. Definição da Animação (Ativa durante todo o processo) */
        .slide-vertical-enter-active, .slide-vertical-leave-active {
            transition: all 0.5s ease-in-out;
            opacity: 1;
        }

        /* 2. ESTADO INICIAL DE ENTRADA (Vem de Cima) */
        .slide-vertical-enter {
            transform: translateY(-100%); /* Começa totalmente acima da tela */
            opacity: 0; /* Começa invisível */
        }

        /* 3. ESTADO FINAL DE SAÍDA (Vai para Baixo) */
        .slide-vertical-leave-to {
            transform: translateY(100%); /* Termina totalmente abaixo da tela */
            opacity: 0; /* Termina invisível */
        }

        /* O estado padrão do modal centralizado (transform: translateY(0)) 
           é mantido quando visível. */

    </style>
</head>
<body>

    <div id="app">
        
        <button class="btn-abrir" @click="mostrarModal = true">
            Abrir Modal Vertical
        </button>

        <transition name="slide-vertical">
            <div class="modal-overlay" v-if="mostrarModal" @click.self="mostrarModal = false">
                <div class="modal-container">
                    <h2>Entrou por Cima... ✨</h2>
                    <p>...e vai sair por Baixo!</p>
                    <p>Observe o movimento vertical suave. O fundo ainda escurece com um fade.</p>
                    
                    <button class="btn-fechar" @click="mostrarModal = false">
                        Fechar
                    </button>
                </div>
            </div>
        </transition>

    </div>

    <script>
        new Vue({
            el: '#app',
            data: {
                mostrarModal: false
            }
        });
    </script>

</body>
</html>
