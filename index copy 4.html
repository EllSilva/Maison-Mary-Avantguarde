<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vue Scroll Suave</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

/* Navbar */
nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:#222;
    padding:15px;
    text-align:center;
    z-index:1000;
}

nav a{
    color:#fff;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
}

nav a:hover{
    color:#f44336;
}

/* Secções */
section{
    height:100vh;
    padding:100px 30px 50px;
    scroll-margin-top:80px; /* offset extra */
}

/* Cores */
#inicio{ background:#f5f5f5; }
#sobre{ background:#e9e9e9; }
#servicos{ background:#dddddd; }
#contacto{ background:#cccccc; }

h1{
    margin-bottom:20px;
}
</style>
</head>

<body>

<div id="app">

    <nav>
        <a href="#" @click.prevent="scrollTo('inicio')">Início</a>
        <a href="#" @click.prevent="scrollTo('sobre')">Sobre</a>
        <a href="#" @click.prevent="scrollTo('servicos')">Serviços</a>
        <a href="#" @click.prevent="scrollTo('contacto')">Contacto</a>
    </nav>

    <section id="inicio">
        <h1>Início</h1>
    </section>

    <section id="sobre">
        <h1>Sobre Nós</h1>
    </section>

    <section id="servicos">
        <h1>Serviços</h1>
    </section>

    <section id="contacto">
        <h1>Contacto</h1>
    </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>

<script>
new Vue({
    el: "#app",
    methods: {
        scrollTo(id) {
            const target = document.getElementById(id);
            if (!target) return;

            const start = window.scrollY;
            const end = target.offsetTop - 60;
            const distance = end - start;

            let startTime = null;

            const duration = 1200; // velocidade do scroll

            function easeInOutCubic(t, b, c, d) {
                t /= d / 2;
                if (t < 1) return c / 2 * t * t * t + b;
                t -= 2;
                return c / 2 * (t * t * t + 2) + b;
            }

            function animation(currentTime) {
                if (!startTime) startTime = currentTime;

                const timeElapsed = currentTime - startTime;
                const run = easeInOutCubic(timeElapsed, start, distance, duration);

                window.scrollTo(0, run);

                if (timeElapsed < duration) {
                    requestAnimationFrame(animation);
                }
            }

            requestAnimationFrame(animation);
        }
    }
});
</script>

</body>
</html>
